name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Test route Core memanggil aplikasi di atas database yang sudah dimigrasi.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: operations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d operations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: operations_test
      DB_USERNAME: ci
      DB_PASSWORD: ci-only-not-a-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Check boundaries
        run: bun run check:boundaries

      - name: Migrate the test database
        run: bun run migrate

      - name: Test against the migrated database
        run: bun run test

      - name: Build
        run: bun run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: operations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d operations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: operations_ci
      DB_USERNAME: ci
      DB_PASSWORD: ci-only-not-a-secret
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: operations_ci
      PGUSER: ci
      PGPASSWORD: ci-only-not-a-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate an empty database
        run: bun scripts/migrate.ts

      - name: Check ids and user ids are uuid and both mappings are exact
        run: psql -X -v ON_ERROR_STOP=1 -f database/check-ids.sql

      - name: Migrate again without changes
        run: |
          output=$(bun scripts/migrate.ts)
          echo "$output"
          grep -qx 'database is up to date' <<< "$output"

      - name: Install Core alone, then the modules, and compare schemas
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          psql -X -v ON_ERROR_STOP=1 -c 'create database operations_ci_core_first'
          DB_DATABASE=operations_ci_core_first bun scripts/migrate.ts --modules ''
          DB_DATABASE=operations_ci_core_first bun scripts/migrate.ts
          dump() {
            docker exec "$POSTGRES_CONTAINER" pg_dump -U ci --schema-only \
              --exclude-table=public.schema_migrations -d "$1" |
              grep -Ev '^\\(un)?restrict '
          }
          dump operations_ci > all-at-once.sql
          dump operations_ci_core_first > core-first.sql
          diff all-at-once.sql core-first.sql
