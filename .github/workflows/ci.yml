name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Test route Core memanggil aplikasi di atas database yang sudah dimigrasi. Test sesi berjalan di PostgreSQL dan
    # di Valkey sungguhan, karena tiruan yang menjawab tetap menyembunyikan penulisan yang membuat ulang sesi.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: operations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d operations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: operations_test
      DB_USERNAME: ci
      DB_PASSWORD: ci-only-not-a-secret
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: 6379
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # src/client.tsx dan kontrak API di-commit supaya TypeScript mengenalnya; berkas yang tertinggal dari kodenya
      # ditolak di sini, sebelum typecheck dan build memakainya.
      - name: Check generated client files
        run: bun run check:generated

      - name: Typecheck
        run: bun run typecheck

      # Aturan type-aware: nilai `any` yang bocor, promise yang tidak ditunggu, `!`, dan switch yang tidak lengkap.
      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check boundaries
        run: bun run check:boundaries

      # Pola layar yang di CoreERP dijaga ESLint dan skrip check-*.mjs: pencarian di toolbar, filter di panel kiri,
      # DataTable SDK, kontrol form SDK, tanpa dialog bawaan browser, dan Core netral sektor.
      - name: Check UI rules
        run: bun run check:ui

      # Golden run dan conformance hanya bisa berjalan di lab; di sini cukup test pembanding dan pemetaan id harness.
      - name: Test the parity harness
        run: python3 -B -m unittest discover -s parity

      - name: Migrate the test database
        run: bun run migrate

      - name: Test against the migrated database
        run: bun run test

      # Server dan peramban, jadi halaman yang rusak gagal di sini.
      - name: Build
        run: bun run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: operations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d operations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: operations_ci
      DB_USERNAME: ci
      DB_PASSWORD: ci-only-not-a-secret
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: operations_ci
      PGUSER: ci
      PGPASSWORD: ci-only-not-a-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate an empty database
        run: bun src/migrate.ts

      - name: Check ids and user ids are uuid and both mappings are exact
        run: psql -X -v ON_ERROR_STOP=1 -f database/check-ids.sql

      - name: Migrate again without changes
        run: |
          output=$(bun src/migrate.ts)
          echo "$output"
          grep -qx 'database is up to date' <<< "$output"

      - name: Install Core alone, then the modules, and compare schemas
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          psql -X -v ON_ERROR_STOP=1 -c 'create database operations_ci_core_first'
          DB_DATABASE=operations_ci_core_first bun src/migrate.ts --modules ''
          DB_DATABASE=operations_ci_core_first bun src/migrate.ts
          dump() {
            docker exec "$POSTGRES_CONTAINER" pg_dump -U ci --schema-only \
              --exclude-table=public.schema_migrations -d "$1" |
              grep -Ev '^\\(un)?restrict '
          }
          dump operations_ci > all-at-once.sql
          dump operations_ci_core_first > core-first.sql
          diff all-at-once.sql core-first.sql
