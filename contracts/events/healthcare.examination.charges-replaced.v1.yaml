asyncapi: 3.0.0
info:
  title: healthcare.examination.charges-replaced.v1
  version: 1.0.0
  description: |
    Potret penuh Biaya Tindakan satu pemeriksaan rawat jalan untuk kasir. Diterbitkan module layanan kesehatan
    (`modules/healthcare`) lewat `publishEvent` di transaksi Simpan rekam medis yang membawa Biaya Tindakan, sama dengan
    sistem lama yang menulis ulang `SIMtrRJTransaksi` setiap kali poli menyimpan. Tarif dan komponen adalah nilai yang
    dibekukan saat baris pertama kali disimpan.

    Penerima mengganti baris biaya terbuka pemeriksaan itu dengan isi `lines`: baris yang tidak ada lagi dihapus, jadi
    `lines` kosong berarti pemeriksaan itu tidak lagi punya biaya tindakan.

    Keadaan sebenarnya, 13 November 2026:
    - Event hanya diantar di dalam runtime. Penerima: kasir Core (`src/foundation/billing/charge/`), yang menyimpan
     barisnya di `rincian_biaya`. Belum ada pengirim ke luar runtime.
    - Belum membawa BHP, obat, lab, dan daftar jenis bayar yang diizinkan tipe pasien; itu menyusul sebagai field
     opsional.
    - Baris yang sudah ditagih kasir belum dikunci di layanan kesehatan; kuncinya menyusul bersama Simpan pembayaran.
channels:
  healthcare.examination.charges-replaced.v1:
    address: healthcare.examination.charges-replaced.v1
    messages:
      chargesReplaced:
        $ref: '#/components/messages/chargesReplaced'
operations:
  publishChargesReplaced:
    action: send
    channel:
      $ref: '#/channels/healthcare.examination.charges-replaced.v1'
    messages:
      - $ref: '#/channels/healthcare.examination.charges-replaced.v1/messages/chargesReplaced'
components:
  messages:
    chargesReplaced:
      name: chargesReplaced
      contentType: application/json
      payload:
        $ref: '#/components/schemas/envelope'
  schemas:
    envelope:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          occurred_at,
          tenant_id,
          legal_entity_id,
          org_unit_id,
          correlation_id,
          data,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Id baris outbox_events, sekaligus id event untuk penerima yang idempoten.
        type:
          const: healthcare.examination.charges-replaced.v1
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
          description: Legal entity kunjungan.
        org_unit_id:
          type: string
          format: uuid
          description: Operating unit kunjungan.
        correlation_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/charges'
    charges:
      type: object
      additionalProperties: false
      required: [examination_id, visit_id, registration_number, lines]
      properties:
        examination_id:
          type: string
          format: uuid
          description: Id pemeriksaan (rekam medis satu tujuan kunjungan).
        visit_id:
          type: string
          format: uuid
        registration_number:
          type: string
          description: Nomor registrasi kunjungan (NoReg).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/line'
    line:
      type: object
      additionalProperties: false
      required:
        [
          line_id,
          procedure_id,
          procedure_code,
          procedure_name,
          service_group_id,
          service_group_name,
          service_group_order,
          category_name,
          quantity,
          tariff,
          doctor_id,
          doctor_name,
          section_id,
          section_name,
          date,
          components,
        ]
      properties:
        line_id:
          type: string
          format: uuid
          description: Id baris Biaya Tindakan, tetap selama baris itu ada.
        procedure_id:
          type: string
          format: uuid
        procedure_code:
          type: string
        procedure_name:
          type: string
        service_group_id:
          type: [string, 'null']
          format: uuid
          description: Kelompok tindakan (Group Jasa sistem lama).
        service_group_name:
          type: [string, 'null']
        service_group_order:
          type: [integer, 'null']
        category_name:
          type: [string, 'null']
          description: Kategori tindakan.
        quantity:
          type: string
          description: Qty, teks desimal.
        tariff:
          type: string
          description: Tarif satuan yang dibekukan, teks desimal; 0 bila tindakan tanpa tarif.
        doctor_id:
          type: [string, 'null']
          format: uuid
        doctor_name:
          type: [string, 'null']
        section_id:
          type: string
          format: uuid
        section_name:
          type: string
        date:
          type: string
          format: date
          description: Tanggal kunjungan.
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [charge_component_id, value]
            properties:
              charge_component_id:
                type: string
                format: uuid
                description: Komponen biaya Core.
              value:
                type: string
                description: Nilai komponen untuk satu satuan, teks desimal.
