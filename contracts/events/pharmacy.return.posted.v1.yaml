asyncapi: 3.0.0
info:
  title: pharmacy.return.posted.v1
  version: 1.0.0
  description: |
    Pasien mengembalikan sebagian atau seluruh obat yang sudah diserahkan, dan returnya sudah diposting: stok masuk
    kembali ke lokasi penyerahan. Diterbitkan module farmasi (`modules/pharmacy`) lewat `publishEvent` di transaksi yang
    sama dengan posting retur, jadi gagal sesudahnya membatalkan keduanya. Retur diposting saat disimpan; tidak ada
    draf. Pembatalannya diterbitkan sebagai `pharmacy.return.reversed.v1`.

    Isi `data` adalah potret retur: resep asal (id dan nomor dari `healthcare.prescription.issued.v1`), penyerahan yang
    diretur (id dan nomor dari `pharmacy.prescription.dispensed.v1`), nomor, tanggal, dan alasan retur, lokasi stok
    masuk, lalu satu baris per obat resep yang diretur dengan jumlahnya, batch yang kembali, dan
    `returned_base_quantity`: total retur yang masih berlaku atas baris resep itu sesudah retur ini, dalam satuan dasar.
    Legal entity dan operating unit resep ada di envelope.

    Maknanya mengikuti sistem lama (Kuta 1): retur menambah `BILLFarmasiDetail.JmlRetur` dan tidak mengubah resep
    dokter, dan CPPT menampilkan "Obat Direalisasi" sebagai `JmlObat - JmlRetur`. Padanannya di Business Central adalah
    Return Receipt atas Sales Shipment yang sudah diposting.

    Keadaan sebenarnya, 13 November 2026:
    - Retur hanya dalam satuan dasar barang, jadi `unit` sama dengan `base_unit` dan `quantity` sama dengan
      `base_quantity`. Satuan lain dengan konversi belum ada di retur maupun penyerahan.
    - Event hanya diantar di dalam runtime ke handler module yang terpasang. Belum ada pengirim ke luar runtime, jadi
      baris `outbox_events` menjadi catatan dan `published_at` tetap kosong.
    - Penerima: module layanan kesehatan (`modules/healthcare`), bila terpasang, menyalin `returned_base_quantity` ke
      baris resep E-Resep-nya, sehingga E-Resep menampilkan yang diserahkan dikurangi yang dikembalikan. Isi yang tidak
      cocok dicatat ke log lalu dilewati.
channels:
  pharmacy.return.posted.v1:
    address: pharmacy.return.posted.v1
    messages:
      returnPosted:
        $ref: '#/components/messages/returnPosted'
operations:
  publishReturnPosted:
    action: send
    channel:
      $ref: '#/channels/pharmacy.return.posted.v1'
    messages:
      - $ref: '#/channels/pharmacy.return.posted.v1/messages/returnPosted'
components:
  messages:
    returnPosted:
      name: returnPosted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/envelope'
  schemas:
    envelope:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          occurred_at,
          tenant_id,
          legal_entity_id,
          org_unit_id,
          correlation_id,
          data,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Id baris outbox_events, sekaligus id event untuk penerima yang idempoten.
        type:
          const: pharmacy.return.posted.v1
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
          description: Legal entity resep, sama dengan envelope pharmacy.prescription.dispensed.v1.
        org_unit_id:
          type: string
          format: uuid
          description: Operating unit kunjungan resep.
        correlation_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/return'
    return:
      type: object
      additionalProperties: false
      required:
        [
          return_id,
          return_number,
          return_date,
          reason,
          posted_at,
          dispensing_id,
          dispensing_number,
          prescription_id,
          prescription_number,
          location,
          lines,
        ]
      properties:
        return_id:
          type: string
          format: uuid
        return_number:
          type: string
          description: Nomor retur dari number sequence operating unit resep.
        return_date:
          type: string
          format: date
          description: Tanggal posting retur menurut zona waktu legal entity.
        reason:
          type: string
          description: Alasan obat dikembalikan, ditulis petugas farmasi.
        posted_at:
          type: string
          format: date-time
        dispensing_id:
          type: string
          format: uuid
          description: dispensing_id dari pharmacy.prescription.dispensed.v1.
        dispensing_number:
          type: string
        prescription_id:
          type: string
          format: uuid
          description: prescription_id dari healthcare.prescription.issued.v1.
        prescription_number:
          type: string
        location:
          $ref: '#/components/schemas/reference'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/line'
    line:
      type: object
      additionalProperties: false
      description: |
        Satu baris per obat resep yang diretur (obat tunggal atau komponen racikan). `unit` dan `quantity` berbentuk
        sama dengan baris pharmacy.prescription.dispensed.v1: satuan dan jumlah seperti yang dicatat farmasi.
        `base_unit` dan `base_quantity` adalah jumlah yang sama dalam satuan dasar barang, yang dipakai penerima untuk
        menghitung selisih dengan yang diserahkan. Jumlah ditulis sebagai teks desimal.
      required:
        [
          prescription_line_id,
          item,
          unit,
          quantity,
          base_unit,
          base_quantity,
          returned_base_quantity,
          batches,
        ]
      properties:
        prescription_line_id:
          type: string
          format: uuid
          description: id baris dari healthcare.prescription.issued.v1.
        item:
          $ref: '#/components/schemas/reference'
        unit:
          $ref: '#/components/schemas/reference'
        quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Jumlah yang dikembalikan lewat retur ini, dalam `unit`.
        base_unit:
          $ref: '#/components/schemas/reference'
        base_quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: '`quantity` dalam satuan dasar (`base_unit`).'
        returned_base_quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            Total retur yang masih berlaku atas baris resep ini sesudah retur ini, termasuk retur sebelumnya, dalam
            satuan dasar (`base_unit`). Yang dipegang pasien adalah jumlah yang diserahkan dalam satuan dasar dikurangi
            angka ini.
        batches:
          type: array
          minItems: 1
          description: Batch yang kembali. Jumlah per batch dalam satuan dasar, seperti stok.
          items:
            $ref: '#/components/schemas/batch'
    batch:
      type: object
      additionalProperties: false
      required: [batch_number, expiry_date, quantity]
      properties:
        batch_number:
          type: [string, 'null']
          description: Kosong untuk stok tanpa batch.
        expiry_date:
          type: [string, 'null']
          format: date
        quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
    reference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
