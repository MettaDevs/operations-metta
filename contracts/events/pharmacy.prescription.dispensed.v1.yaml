asyncapi: 3.0.0
info:
  title: pharmacy.prescription.dispensed.v1
  version: 1.0.0
  description: |
    Obat sebuah resep sudah diserahkan ke pasien. Diterbitkan module farmasi (`modules/pharmacy`) lewat `publishEvent`
    di transaksi yang sama dengan perubahan penyerahan menjadi diserahkan, jadi gagal sesudahnya membatalkan keduanya,
    dan Serahkan yang diulang tidak menerbitkan event kedua. Satu resep diserahkan sekali: penyiapan yang dibatalkan
    sebelum diserahkan tidak menerbitkan apa pun.

    Isi `data` adalah potret saat diserahkan: resep asal (id dan nomor dari `healthcare.prescription.issued.v1`),
    nomor penyerahan, lokasi stok keluar, apoteker dan asisten, lalu satu baris per obat resep (obat tunggal dan komponen
    racikan; kepala racikan tidak punya baris) dengan jumlah resep, jumlah yang diserahkan, alasan bila kurang, dan
    batch yang diambil. Legal entity dan operating unit resep ada di envelope.

    Keadaan sebenarnya, 13 November 2026:
    - Event hanya diantar di dalam runtime ke handler module yang terpasang. Belum ada pengirim ke luar runtime, jadi
      baris `outbox_events` menjadi catatan dan `published_at` tetap kosong.
    - Penerima: module layanan kesehatan (`modules/healthcare`), bila terpasang, mencatat waktu dan jumlah yang
      diserahkan pada resep E-Resep-nya. Isi yang tidak cocok dicatat ke log lalu dilewati.
    - Jumlah di sini adalah yang diserahkan, bukan dikurangi retur. Retur sesudahnya diterbitkan sebagai
      `pharmacy.return.posted.v1`, dan pembatalannya sebagai `pharmacy.return.reversed.v1`.
channels:
  pharmacy.prescription.dispensed.v1:
    address: pharmacy.prescription.dispensed.v1
    messages:
      prescriptionDispensed:
        $ref: '#/components/messages/prescriptionDispensed'
operations:
  publishPrescriptionDispensed:
    action: send
    channel:
      $ref: '#/channels/pharmacy.prescription.dispensed.v1'
    messages:
      - $ref: '#/channels/pharmacy.prescription.dispensed.v1/messages/prescriptionDispensed'
components:
  messages:
    prescriptionDispensed:
      name: prescriptionDispensed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/envelope'
  schemas:
    envelope:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          occurred_at,
          tenant_id,
          legal_entity_id,
          org_unit_id,
          correlation_id,
          data,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Id baris outbox_events, sekaligus id event untuk penerima yang idempoten.
        type:
          const: pharmacy.prescription.dispensed.v1
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
          description: Legal entity resep, sama dengan envelope healthcare.prescription.issued.v1.
        org_unit_id:
          type: string
          format: uuid
          description: Operating unit kunjungan resep.
        correlation_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/dispensing'
    dispensing:
      type: object
      additionalProperties: false
      required:
        [
          dispensing_id,
          dispensing_number,
          prescription_id,
          prescription_number,
          dispensed_at,
          location,
          pharmacist,
          assistant,
          lines,
        ]
      properties:
        dispensing_id:
          type: string
          format: uuid
        dispensing_number:
          type: string
          description: Nomor penyerahan dari number sequence operating unit resep.
        prescription_id:
          type: string
          format: uuid
          description: prescription_id dari healthcare.prescription.issued.v1.
        prescription_number:
          type: string
        dispensed_at:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/reference'
        pharmacist:
          description: Apoteker yang menyerahkan; pengguna tenant.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/person'
        assistant:
          description: Asisten apoteker yang menyiapkan; pengguna tenant.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/person'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/line'
    line:
      type: object
      additionalProperties: false
      description: |
        Jumlah ditulis sebagai teks desimal. `quantity` boleh 0 dan ditulis dalam `unit`, satuan yang dipakai farmasi
        saat menyerahkan; satuan itu boleh berbeda dari satuan resep selama milik barang yang sama. `quantity_per_unit`
        adalah isi `unit` dalam satuan dasar barang (`base_unit`), dan `base_quantity` adalah `quantity` dalam satuan
        dasar, yang dipakai penerima untuk menghitung yang dipegang pasien. `prescribed_quantity` ditulis dalam
        `prescribed_unit`, satuan yang ditulis dokter. Jumlah batch dalam satuan dasar, seperti stok.

        Field `quantity_per_unit`, `base_unit`, `base_quantity`, dan `prescribed_unit` ditambahkan sesudah versi ini
        terbit, jadi opsional; penerbit selalu mengisinya. Pesan yang belum membawanya ditulis dalam satuan dasar:
        `unit` adalah satuan dasar barang, `base_quantity` sama dengan `quantity`, dan `prescribed_unit` sama dengan
        `unit`.
      required:
        [
          prescription_line_id,
          item,
          unit,
          prescribed_quantity,
          quantity,
          reason,
          batches,
        ]
      properties:
        prescription_line_id:
          type: string
          format: uuid
          description: id baris dari healthcare.prescription.issued.v1.
        item:
          $ref: '#/components/schemas/reference'
        unit:
          $ref: '#/components/schemas/reference'
        quantity_per_unit:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Isi `unit` dalam satuan dasar barang, misalnya 10 untuk strip berisi 10 tablet.
        base_unit:
          $ref: '#/components/schemas/reference'
        base_quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: '`quantity` dalam satuan dasar (`base_unit`).'
        prescribed_unit:
          $ref: '#/components/schemas/reference'
        prescribed_quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Jumlah yang ditulis dokter, dalam `prescribed_unit`.
        quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Jumlah yang diserahkan, dalam `unit`.
        reason:
          type: [string, 'null']
          description: Alasan bila yang diserahkan kurang dari resep.
        batches:
          type: array
          description: Batch yang diambil dari stok, jumlahnya dalam satuan dasar; kosong bila tidak ada yang diserahkan.
          items:
            $ref: '#/components/schemas/batch'
    batch:
      type: object
      additionalProperties: false
      required: [batch_number, expiry_date, quantity]
      properties:
        batch_number:
          type: [string, 'null']
          description: Kosong untuk stok tanpa batch.
        expiry_date:
          type: [string, 'null']
          format: date
        quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
    reference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    person:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
