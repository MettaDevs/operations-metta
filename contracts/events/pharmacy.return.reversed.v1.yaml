asyncapi: 3.0.0
info:
  title: pharmacy.return.reversed.v1
  version: 1.0.0
  description: |
    Retur obat pasien yang sudah diposting dibatalkan (Batal retur): stok yang masuk lewat retur itu keluar lagi lewat
    baris pembalik, dan obatnya kembali dihitung dipegang pasien. Diterbitkan module farmasi (`modules/pharmacy`) lewat
    `publishEvent` di transaksi yang sama dengan pembatalan, jadi gagal sesudahnya membatalkan keduanya, dan Batal retur
    yang diulang tidak menerbitkan event kedua. Pasangannya `pharmacy.return.posted.v1`.

    Isi `data` sama dengan `pharmacy.return.posted.v1` untuk retur yang sama, ditambah `reversed_at`. `quantity` setiap
    baris adalah jumlah retur yang dibatalkan, dan `returned_base_quantity` total retur yang masih berlaku atas baris
    resep itu sesudah pembatalan ini.

    Sistem lama (Kuta 1) tidak punya Batal retur: layar retur hanya membuat dan melihat. Di sini pembatalan
    mengembalikan keadaan sebelum retur, termasuk yang tampil di E-Resep. Padanannya di Business Central adalah Undo
    Return Receipt.

    Keadaan sebenarnya, 13 November 2026:
    - Retur hanya dalam satuan dasar barang, jadi `unit` sama dengan `base_unit` dan `quantity` sama dengan
      `base_quantity`. Satuan lain dengan konversi belum ada di retur maupun penyerahan.
    - Event hanya diantar di dalam runtime ke handler module yang terpasang. Belum ada pengirim ke luar runtime, jadi
      baris `outbox_events` menjadi catatan dan `published_at` tetap kosong.
    - Penerima: module layanan kesehatan (`modules/healthcare`), bila terpasang, menyalin `returned_base_quantity` ke
      baris resep E-Resep-nya. Isi yang tidak cocok dicatat ke log lalu dilewati.
channels:
  pharmacy.return.reversed.v1:
    address: pharmacy.return.reversed.v1
    messages:
      returnReversed:
        $ref: '#/components/messages/returnReversed'
operations:
  publishReturnReversed:
    action: send
    channel:
      $ref: '#/channels/pharmacy.return.reversed.v1'
    messages:
      - $ref: '#/channels/pharmacy.return.reversed.v1/messages/returnReversed'
components:
  messages:
    returnReversed:
      name: returnReversed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/envelope'
  schemas:
    envelope:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          occurred_at,
          tenant_id,
          legal_entity_id,
          org_unit_id,
          correlation_id,
          data,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Id baris outbox_events, sekaligus id event untuk penerima yang idempoten.
        type:
          const: pharmacy.return.reversed.v1
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
          description: Legal entity resep, sama dengan envelope pharmacy.prescription.dispensed.v1.
        org_unit_id:
          type: string
          format: uuid
          description: Operating unit kunjungan resep.
        correlation_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/return'
    return:
      type: object
      additionalProperties: false
      required:
        [
          return_id,
          return_number,
          return_date,
          reason,
          posted_at,
          reversed_at,
          dispensing_id,
          dispensing_number,
          prescription_id,
          prescription_number,
          location,
          lines,
        ]
      properties:
        return_id:
          type: string
          format: uuid
        return_number:
          type: string
          description: Nomor retur dari number sequence operating unit resep.
        return_date:
          type: string
          format: date
          description: Tanggal posting retur menurut zona waktu legal entity.
        reason:
          type: string
          description: Alasan obat dikembalikan, ditulis petugas farmasi.
        posted_at:
          type: string
          format: date-time
        reversed_at:
          type: string
          format: date-time
        dispensing_id:
          type: string
          format: uuid
          description: dispensing_id dari pharmacy.prescription.dispensed.v1.
        dispensing_number:
          type: string
        prescription_id:
          type: string
          format: uuid
          description: prescription_id dari healthcare.prescription.issued.v1.
        prescription_number:
          type: string
        location:
          $ref: '#/components/schemas/reference'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/line'
    line:
      type: object
      additionalProperties: false
      description: |
        Satu baris per obat resep yang diretur (obat tunggal atau komponen racikan). `unit` dan `quantity` berbentuk
        sama dengan baris pharmacy.prescription.dispensed.v1: satuan dan jumlah seperti yang dicatat farmasi.
        `base_unit` dan `base_quantity` adalah jumlah yang sama dalam satuan dasar barang, yang dipakai penerima untuk
        menghitung selisih dengan yang diserahkan. Jumlah ditulis sebagai teks desimal.
      required:
        [
          prescription_line_id,
          item,
          unit,
          quantity,
          base_unit,
          base_quantity,
          returned_base_quantity,
          batches,
        ]
      properties:
        prescription_line_id:
          type: string
          format: uuid
          description: id baris dari healthcare.prescription.issued.v1.
        item:
          $ref: '#/components/schemas/reference'
        unit:
          $ref: '#/components/schemas/reference'
        quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Jumlah retur yang dibatalkan, dalam `unit`.
        base_unit:
          $ref: '#/components/schemas/reference'
        base_quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: '`quantity` dalam satuan dasar (`base_unit`).'
        returned_base_quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            Total retur yang masih berlaku atas baris resep ini sesudah pembatalan ini, dalam satuan dasar
            (`base_unit`); 0 bila tidak ada lagi. Yang dipegang pasien adalah jumlah yang diserahkan dalam satuan dasar
            dikurangi angka ini.
        batches:
          type: array
          minItems: 1
          description: |
            Batch yang keluar lagi karena returnya dibatalkan. Jumlah per batch dalam satuan dasar, seperti stok.
          items:
            $ref: '#/components/schemas/batch'
    batch:
      type: object
      additionalProperties: false
      required: [batch_number, expiry_date, quantity]
      properties:
        batch_number:
          type: [string, 'null']
          description: Kosong untuk stok tanpa batch.
        expiry_date:
          type: [string, 'null']
          format: date
        quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
    reference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
