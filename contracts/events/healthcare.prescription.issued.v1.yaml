asyncapi: 3.0.0
info:
  title: healthcare.prescription.issued.v1
  version: 1.0.0
  description: |
    Resep pemeriksaan rawat jalan dikirim ke farmasi. Diterbitkan module layanan kesehatan (`modules/healthcare`)
    lewat `publishEvent` di transaksi yang sama dengan perubahan resep dari draf menjadi dikirim, sehingga gagal
    sesudahnya membatalkan keduanya, dan Kirim yang diulang tidak menerbitkan event kedua.

    Isi `data` adalah potret lengkap saat resep dikirim, supaya farmasi tidak perlu membaca tabel layanan kesehatan.
    Legal entity dan operating unit kunjungan ada di envelope (`legal_entity_id`, `org_unit_id`); barang di baris resep
    adalah barang persediaan Core milik legal entity itu, jadi farmasi mengeluarkan stoknya dari lokasi di legal entity
    yang sama.

    Keadaan sebenarnya, 13 November 2026:
    - Event hanya diantar di dalam runtime ke handler module yang terpasang. Belum ada pengirim ke luar runtime, jadi
      baris `outbox_events` menjadi catatan dan `published_at` tetap kosong.
    - Penerima: module farmasi (`modules/pharmacy`), bila terpasang untuk tenant itu, mencatat resep di antrean
      farmasi. Isi yang tidak cocok dengan kontrak ini dicatat ke log lalu dilewati, tanpa membatalkan pengiriman.
    - `price_group` ditambahkan sesudah versi ini terbit, jadi opsional: farmasi menghitung harga obat dengan kelompok
      harga itu saat resep disiapkan. Pesan tanpa `price_group` diperlakukan sama dengan `price_group` kosong, yaitu
      obat dihargai harga dasar barang tanpa kenaikan.
    - `patient.ktp` ditambahkan sesudah versi ini terbit, jadi opsional: farmasi memakai baris grading harga obat untuk
      nilai KTP itu saat resep disiapkan. Pesan tanpa `patient.ktp` diperlakukan sebagai `true`, bawaan sistem lama.
    - Belum ada event pembatalan resep: layar tidak menawarkan membatalkan resep yang sudah dikirim, dan kunjungan hanya
      bisa dibatalkan sebelum diperiksa, jadi status `dibatalkan` belum pernah ditulis.
channels:
  healthcare.prescription.issued.v1:
    address: healthcare.prescription.issued.v1
    messages:
      prescriptionIssued:
        $ref: '#/components/messages/prescriptionIssued'
operations:
  publishPrescriptionIssued:
    action: send
    channel:
      $ref: '#/channels/healthcare.prescription.issued.v1'
    messages:
      - $ref: '#/channels/healthcare.prescription.issued.v1/messages/prescriptionIssued'
components:
  messages:
    prescriptionIssued:
      name: prescriptionIssued
      contentType: application/json
      payload:
        $ref: '#/components/schemas/envelope'
  schemas:
    envelope:
      type: object
      additionalProperties: false
      required: [id, type, occurred_at, tenant_id, legal_entity_id, org_unit_id, correlation_id, data]
      properties:
        id:
          type: string
          format: uuid
          description: Id baris outbox_events, sekaligus id event untuk penerima yang idempoten.
        type:
          const: healthcare.prescription.issued.v1
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
          description: Legal entity kunjungan.
        org_unit_id:
          type: string
          format: uuid
          description: Operating unit kunjungan.
        correlation_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/prescription'
    prescription:
      type: object
      additionalProperties: false
      required:
        [prescription_id, prescription_number, registration_number, issued_at, notes, patient, doctor, section, lines]
      properties:
        prescription_id:
          type: string
          format: uuid
        prescription_number:
          type: string
          description: Nomor resep (NoResep) dari number sequence unit kunjungan.
        registration_number:
          type: string
          description: Nomor registrasi kunjungan (NoReg).
        issued_at:
          type: string
          format: date-time
        notes:
          type: [string, 'null']
          description: Catatan resep.
        patient:
          type: object
          additionalProperties: false
          required: [id, medical_record_number, name, birth_date]
          properties:
            id:
              type: string
              format: uuid
            medical_record_number:
              type: string
              description: NRM.
            name:
              type: string
            birth_date:
              type: [string, 'null']
              format: date
            ktp:
              type: boolean
              description: |
                Patient KTP kunjungan: `true` bila pasien memegang KTP setempat (PasienKTP sistem lama), disalin dari
                pasien saat kunjungan didaftarkan, jadi perubahan pasien sesudahnya tidak mengubahnya. Penerbit selalu
                mengisinya; opsional karena ditambahkan sesudah versi ini terbit, dan pesan tanpa field ini berarti
                `true`.
        doctor:
          description: Dokter dari Anamnesa saat resep dikirim; kosong bila belum diisi.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
        section:
          type: object
          additionalProperties: false
          required: [id, name]
          description: Section asal resep (poli tempat pemeriksaan).
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        price_group:
          description: |
            Kelompok harga pembeli: kelompok harga tipe pasien kunjungan saat resep dikirim (Customer Price Group di
            BC). Kosong bila tipe pasien itu tidak memakai kelompok harga. Penerbit selalu mengisinya; opsional karena
            ditambahkan sesudah versi ini terbit.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/priceGroup'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/line'
    line:
      type: object
      additionalProperties: false
      description: |
        Tiga bentuk baris, seperti sistem lama:
        - obat tunggal: `item` terisi, `compound` kosong, `quantity` terisi;
        - kepala racikan ("Racikan N"): `item` kosong, `compound` N, `requested_quantity` terisi, signa dan aturan pakai
          racikan;
        - komponen racikan: `item` terisi, `compound` N, `quantity` terisi, tanpa signa dan aturan pakai.
        Jumlah ditulis sebagai teks desimal. `quantity` dalam `unit`, satuan yang ditulis dokter (bawaannya satuan jual
        barang), dan `quantity_per_unit` isi satuan itu dalam satuan dasar barang (`base_unit`), disalin saat baris
        resep disimpan. `base_quantity` adalah `quantity` x `quantity_per_unit`. Penerbit selalu mengisi ketiganya untuk
        baris obat dan mengosongkannya pada kepala racikan. Ketiganya ditambahkan sesudah versi ini terbit, jadi
        opsional: pesan tanpa ketiganya ditulis dalam satuan dasar, yaitu `unit` adalah satuan dasar barang.
      required: [id, order, item, compound, quantity, unit, requested_quantity, signa, usage_instruction, notes]
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 1
        item:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/reference'
        compound:
          type: [integer, 'null']
          minimum: 1
          description: Nomor racikan.
        quantity:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]+)?$'
        unit:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/reference'
        quantity_per_unit:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Isi `unit` dalam satuan dasar barang, misalnya 10 untuk strip berisi 10 tablet.
        base_unit:
          description: Satuan dasar barang.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/reference'
        base_quantity:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: '`quantity` dalam satuan dasar (`base_unit`).'
        requested_quantity:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Jumlah racikan yang diminta (QtyRacik), hanya pada kepala racikan.
        signa:
          type: [string, 'null']
        usage_instruction:
          type: [string, 'null']
          description: Aturan pakai sebagai teks, misalnya Setelah Makan.
        notes:
          type: [string, 'null']
    priceGroup:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Kode kelompok harga, misalnya UMUM.
        name:
          type: string
    reference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
