asyncapi: 3.0.0
info:
  title: healthcare.visit.completed.v1
  version: 1.0.0
  description: |
    Kunjungan selesai diperiksa (StatusPeriksa = 'CO' sistem lama): semua tujuannya selesai. Diterbitkan module layanan
    kesehatan (`modules/healthcare`) di transaksi yang sama dengan perubahan status kunjungan menjadi `selesai`. Isinya
    potret pasien, tipe pasien, penjamin, dan section kunjungan, supaya kasir menampilkan Daftar Pembayaran tanpa
    membaca tabel layanan kesehatan. Kunjungan yang dibuka kembali (`healthcare.visit.reopened.v1`) menerbitkannya lagi
    saat selesai lagi, dengan potret yang diperbarui.

    Sejak 14 November 2026 potret itu membawa dua field opsional dari pengaturan tipe pasien: jenis bayar legal entity
    kunjungan yang dikhususkan tipe pasien lain (`restricted_payment_method_ids`), yang ditolak kasir untuk kunjungan ini,
    dan jenis bayar otomatis (`automatic_payment_method_id`), yang melunasi seluruh tagihan kunjungan begitu kunjungan
    selesai. Field opsional tidak menaikkan versi; penerima yang tidak mengenalnya memperlakukan kunjungan tanpa pembatas
    dan tanpa bayar otomatis.

    Keadaan sebenarnya, 13 November 2026: hanya diantar di dalam runtime. Penerima: kasir Core
    (`src/foundation/billing/charge/`), yang mencatatnya di `kunjungan_kasir` dan langsung membuat pembayaran bila
    `automatic_payment_method_id` terisi.
channels:
  healthcare.visit.completed.v1:
    address: healthcare.visit.completed.v1
    messages:
      visitCompleted:
        $ref: '#/components/messages/visitCompleted'
operations:
  publishVisitCompleted:
    action: send
    channel:
      $ref: '#/channels/healthcare.visit.completed.v1'
    messages:
      - $ref: '#/channels/healthcare.visit.completed.v1/messages/visitCompleted'
components:
  messages:
    visitCompleted:
      name: visitCompleted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/envelope'
  schemas:
    envelope:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          occurred_at,
          tenant_id,
          legal_entity_id,
          org_unit_id,
          correlation_id,
          data,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Id baris outbox_events, sekaligus id event untuk penerima yang idempoten.
        type:
          const: healthcare.visit.completed.v1
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
          description: Legal entity kunjungan.
        org_unit_id:
          type: string
          format: uuid
          description: Operating unit kunjungan.
        correlation_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/visit'
    named:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    visit:
      type: object
      additionalProperties: false
      required:
        [
          visit_id,
          registration_number,
          date,
          registered_at,
          patient,
          patient_type,
          guarantor,
          card_number,
          sections,
        ]
      properties:
        visit_id:
          type: string
          format: uuid
        registration_number:
          type: string
          description: Nomor registrasi kunjungan (NoReg).
        date:
          type: string
          format: date
        registered_at:
          type: string
          format: date-time
        patient:
          type: object
          additionalProperties: false
          required: [id, medical_record_number, name]
          properties:
            id:
              type: string
              format: uuid
            medical_record_number:
              type: string
              description: NRM.
            name:
              type: string
        patient_type:
          $ref: '#/components/schemas/named'
        guarantor:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/named'
        card_number:
          type: [string, 'null']
        sections:
          type: array
          description: Section tujuan kunjungan, berurutan.
          items:
            $ref: '#/components/schemas/named'
        restricted_payment_method_ids:
          type: array
          description: |
            Id jenis bayar kasir (Core) di legal entity kunjungan yang dikhususkan tipe pasien lain. Kasir menolak jenis
            bayar ini untuk kunjungan ini dengan pesan sistem lama "Tidak Dapat Menggunakan Tipe Pembayaran, Karena
            berbeda tipe pasien". Jenis bayar yang tidak disebut boleh dipakai.
          items:
            type: string
            format: uuid
        automatic_payment_method_id:
          type: [string, 'null']
          format: uuid
          description: |
            Id jenis bayar kasir (Core) di legal entity kunjungan yang melunasi seluruh tagihan begitu kunjungan selesai,
            untuk tipe pasien yang lunas otomatis di kasir. Null bila tipe pasiennya dibayar di kasir.
